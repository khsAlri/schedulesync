{% extends "base.html" %}

{% block title %}비밀번호 변경 · schedulesync{% endblock %}

{% block content %}
<section class="card narrow">
  <h1>비밀번호 변경</h1>

  {% if errors %}
    <ul class="errors">
      {% for e in errors %}
        <li>{{ e }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <form method="post" action="/account/password" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <label>
      현재 비밀번호
      <input type="password" name="current_password" required autocomplete="current-password">
    </label>

    <label>
      새 비밀번호 <span class="muted small">(8자 이상)</span>
      <input type="password" name="new_password" required minlength="8" autocomplete="new-password">
    </label>

    <label>
      새 비밀번호 확인
      <input type="password" name="new_password_confirm" required minlength="8" autocomplete="new-password">
    </label>

    <button type="submit" class="btn btn-primary">변경</button>
  </form>
</section>
{% endblock %}
